<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>QA 맛집 레이더 (3-Tier Sandbox)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 relative">
    <!-- [신규] 우측 상단 토스트 알림 배너 -->
    <div id="toast-msg" data-testid="toast-msg" 
         class="hidden fixed top-5 right-5 bg-gray-900 text-white px-5 py-3 rounded-lg shadow-lg z-50 transition-opacity">
    </div>

    <div class="max-w-4xl mx-auto">
        <!-- 상단 헤더 & 로그인 영역 -->
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow-sm">
            <h1 data-testid="page-title" class="text-2xl font-bold text-gray-800">🍽️ 3-Tier 맛집 큐레이션</h1>
            
            <!-- 비로그인 상태 UI -->
            <div id="login-form" data-testid="login-form" class="flex gap-2 items-center">
                <input type="text" id="username-input" data-testid="username-input" placeholder="ID (qa_admin)" class="border rounded px-2.5 py-1 text-sm w-32">
                <input type="password" id="password-input" data-testid="password-input" placeholder="PW (pass1234)" class="border rounded px-2.5 py-1 text-sm w-32">
                <button id="login-btn" data-testid="login-btn" class="bg-gray-800 text-white text-sm px-3 py-1.5 rounded hover:bg-black">로그인</button>
            </div>

            <!-- 로그인 완료 상태 UI -->
            <div id="user-info" data-testid="user-info" class="hidden flex gap-3 items-center">
                <span id="welcome-msg" data-testid="welcome-msg" class="text-sm font-semibold text-blue-700"></span>
                <button id="logout-btn" data-testid="logout-btn" class="text-xs bg-gray-200 px-2.5 py-1 rounded hover:bg-gray-300">로그아웃</button>
            </div>
        </div>

        <!-- 1. 검색 및 필터 영역 -->
        <div class="flex gap-3 mb-6 bg-white p-4 rounded-lg shadow-sm">
            <select id="category-select" data-testid="category-select" class="border rounded px-3 py-2">
                <option value="전체">전체</option>
                <option value="한식">한식</option>
                <option value="일식">일식</option>
                <option value="양식">양식</option>
                <option value="중식">중식</option>
            </select>
            <input type="text" id="search-input" data-testid="search-input" 
                   placeholder="식당명 또는 AI 태그 검색" class="border rounded px-3 py-2 flex-1">
            <button id="search-btn" data-testid="search-btn" 
                    class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">검색</button>
        </div>

        <!-- 2. 신규 맛집 등록 폼 (로그인 시에만 활성화) -->
        <div class="bg-white p-4 rounded-lg shadow-sm mb-6">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-gray-600">➕ 새 맛집 직접 등록</h2>
                <span id="auth-notice" data-testid="auth-notice" class="text-xs text-red-500 font-medium">🔒 로그인 후 등록 및 삭제가 가능합니다.</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-2">
                <input type="text" id="new-name" data-testid="new-name" placeholder="식당명" class="border rounded px-3 py-1.5 disabled:bg-gray-100">
                <select id="new-category" data-testid="new-category" class="border rounded px-3 py-1.5 disabled:bg-gray-100">
                    <option value="한식">한식</option>
                    <option value="일식">일식</option>
                    <option value="양식">양식</option>
                    <option value="중식">중식</option>
                </select>
                <input type="number" step="0.1" id="new-rating" data-testid="new-rating" placeholder="평점 (0.0~5.0)" class="border rounded px-3 py-1.5 disabled:bg-gray-100">
                <input type="text" id="new-tag" data-testid="new-tag" placeholder="AI 태그 (예: 혼밥/가성비)" class="border rounded px-3 py-1.5 disabled:bg-gray-100">
                <button id="add-btn" data-testid="add-btn" class="bg-green-600 text-white rounded px-4 py-1.5 hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed">등록</button>
            </div>
        </div>

        <!-- 3. 상태 메시지(로딩, 에러, 빈 결과) 및 카드 리스트 -->
        <div id="loading-spinner" data-testid="loading-spinner" class="hidden text-center text-blue-600 font-semibold py-6">
            ⏳ 데이터를 불러오는 중입니다...
        </div>
        <div id="error-msg" data-testid="error-msg" class="hidden bg-red-100 text-red-700 p-4 rounded mb-4">
            요청을 처리하는 중 에러가 발생했습니다.
        </div>
        <div id="empty-msg" data-testid="empty-msg" class="hidden text-center text-gray-500 py-8">
            조건에 맞는 맛집이 없습니다.
        </div>
        <div id="restaurant-list" data-testid="restaurant-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
